<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem trước đảo nổi</title>
<style>
  body { margin: 0; padding: 16px; background: #2b241c; color: #eadcc0; font: 14px/1.5 system-ui, sans-serif; }
  h2 { margin: 24px 0 8px; font-size: 16px; }
  canvas { display: block; max-width: 100%; image-rendering: pixelated; background: #000; }
  #trang_thai { color: #c9b48a; }
</style>
</head>
<body>
<!-- Ghép hình đảo nổi (assets/pixellab/diem/, assets/pixellab/tong_mon/) lên ảnh nền vùng Lôi Đình Cốc.
     Danh sách hình lấy từ manifest. Mở qua máy chủ tĩnh đặt gốc ở thư mục repo; thêm ?luu=1 để gửi ảnh PNG về POST /luu. -->
<div id="trang_thai">Đang tải…</div>
<h2>Hình điểm (×3)</h2>
<canvas id="bang_hinh"></canvas>
<h2>Đảo tông môn (×2)</h2>
<canvas id="bang_tong_mon"></canvas>
<h2>Quanh thành chủ (×2)</h2>
<canvas id="quanh_thanh_chu"></canvas>
<h2>Toàn vùng (hình cỡ gốc 64)</h2>
<canvas id="toan_vung"></canvas>
<h2>Toàn vùng, hình ½ cỡ (32)</h2>
<canvas id="toan_vung_nua"></canvas>
<script type="module">
const LOAI = ["thanh_chu", "son_mon", "mo_linh_thach", "mo_quang", "mo_duoc", "linh_tuyen", "cua_bi_canh", "hang_di_thu", "hang_thu_hoang", "deo", "ben_do"];
const params = new URLSearchParams(location.search);
// ?vung=<mã vùng> chọn file điểm và ảnh nền vùng khác (mặc định Lôi Đình Cốc).
const VUNG = params.get("vung") ?? "loi_dinh_coc";
const DIEM = `/data/maps/ha_diem_${VUNG}.json`;
const NEN = `/data/maps/ha_nen_vung/ha_nen_${VUNG}.webp`;
const MANIFEST = "/assets/pixellab/manifest.json";
const trangThai = document.getElementById("trang_thai");

const taiAnh = (src) => new Promise((done) => { const img = new Image(); img.onload = () => done(img); img.onerror = () => done(null); img.src = src; });

// Hình chưa có thì vẽ chỗ giữ: hình tròn có mã loại, cùng cỡ 64.
function choGiu(ten) {
  const c = new OffscreenCanvas(64, 64), g = c.getContext("2d");
  g.fillStyle = "rgba(160,40,40,0.8)"; g.beginPath(); g.arc(32, 44, 18, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#fff"; g.font = "9px sans-serif"; g.textAlign = "center"; g.fillText(ten.slice(0, 10), 32, 47);
  return c;
}

const [duLieu, nen, manifest, boHinh] = await Promise.all([
  fetch(DIEM).then((r) => r.json()), taiAnh(NEN), fetch(MANIFEST).then((r) => r.json()),
  fetch("/assets/pixellab/diem/bo_hinh.json").then((r) => (r.ok ? r.json() : null)).catch(() => null),
]);
const HE = duLieu.region?.element ?? "*";
// Khoá hình = đường dẫn trong assets/pixellab bỏ đuôi; tên hiển thị là phần mô tả trước dấu " (".
// Bộ theo hệ chỉ tải hình của hệ vùng đang xem (diem/<loại>/<hệ>_…).
const cuaVung = (k) => k.split("/").length < 3 || k.split("/")[2].startsWith(`${HE}_`);
const muc = manifest.assets.filter((a) => /^(diem|tong_mon)\//.test(a.file)).map((a) => ({ khoa: a.file.replace(/\.png$/, ""), ten: a.description.split(" (")[0].replace(/^Đảo nổi cho điểm /, "") })).filter((m) => !m.khoa.startsWith("diem/") || cuaVung(m.khoa));
const anh = await Promise.all(muc.map((m) => taiAnh(`/assets/pixellab/${m.khoa}.png`)));
const hinh = Object.fromEntries(muc.map((m, i) => [m.khoa, anh[i] ?? choGiu(m.khoa.split("/")[1])]));
const tenCua = Object.fromEntries(muc.map((m) => [m.khoa, m.ten]));
const khoaDiem = muc.map((m) => m.khoa).filter((k) => k.startsWith("diem/"));
const khoaTongMon = muc.map((m) => m.khoa).filter((k) => k.startsWith("tong_mon/"));

// Biến thể chung cũ của một loại: diem/<loại> và diem/<loại>_<số>.
const bienThe = Object.fromEntries(LOAI.map((l) => [l, khoaDiem.filter((k) => k === `diem/${l}` || new RegExp(`^diem/${l}_\\d+$`).test(k))]));
const bam = (id) => (Math.imul(id + 1, 2654435761) >>> 0);
// Bậc bí cảnh lấy từ trường tier (thap/vua/cao); file cũ chưa có thì tạm chia theo danger.
const bacBiCanh = (p) => p.tier ?? (p.danger < 60 ? "thap" : p.danger < 120 ? "vua" : "cao");
// Trang thử không có chủ mỏ: giả cấp 1–5 theo id để thấy đủ bậc; ?cap=<số> cho mọi mỏ cùng cấp.
const capMo = (p) => (params.get("cap") ? Number(params.get("cap")) : 1 + (bam(p.id * 13) % 5));
const bacCua = (p) => (/^mo_/.test(p.type) ? (capMo(p) >= 5 ? "3" : capMo(p) >= 3 ? "2" : "1") : p.type === "cua_bi_canh" ? bacBiCanh(p) : "0");
// Quy tắc trong diem/bo_hinh.json: hệ vùng rồi hệ "*", thiếu bậc thì lùi về bậc "1" (mỏ), dáng chọn theo id.
function khoaTuBo(p) {
  const theoHe = boHinh?.loai?.[p.type];
  for (const he of [HE, "*"]) {
    const h = theoHe?.[he];
    const ds = h?.[bacCua(p)] ?? (/^mo_/.test(p.type) ? h?.["1"] : null);
    if (ds?.length) return ds[bam(p.id) % ds.length];
  }
  return null;
}
function khoaCho(p) {
  // Vị trí sơn môn: 1/3 để trống, còn lại vẽ như đã có tông môn chiếm, chọn đảo tông môn theo id.
  if (p.type === "son_mon" && khoaTongMon.length && bam(p.id) % 3) return khoaTongMon[bam(p.id * 7) % khoaTongMon.length];
  const k = khoaTuBo(p);
  if (k && hinh[k]) return k;
  if (p.type === "cua_bi_canh" && hinh[`diem/cua_bi_canh_${bacBiCanh(p)}`]) return `diem/cua_bi_canh_${bacBiCanh(p)}`;
  const ds = bienThe[p.type];
  return ds?.length ? ds[bam(p.id) % ds.length] : null;
}

const [fx0, fy0, fx1] = duLieu.map.frame;
const tiLe = nen.width / (fx1 - fx0);
const viTri = (p) => [(p.x - fx0) * tiLe, (p.y - fy0) * tiLe];
// Điểm phía trên vẽ trước để hình phía dưới đè lên, neo giữa cạnh dưới; thành chủ vẽ sau cùng cho khỏi bị che.
const diem = [...duLieu.points].sort((a, b) => (a.type === "thanh_chu") - (b.type === "thanh_chu") || a.y - b.y || a.id - b.id);

// k: phóng cả nền lẫn vị trí; s: cỡ hình so với cỡ gốc 64 (½ để thử khi điểm sát nhau).
function veDiem(g, dx, dy, k, s = 1) {
  for (const p of diem) {
    const khoa = khoaCho(p), h = khoa ? hinh[khoa] : choGiu(p.type), [x, y] = viTri(p), w = h.width * k * s, ht = h.height * k * s;
    g.drawImage(h, Math.round((x - dx) * k - w / 2), Math.round((y - dy) * k - ht), w, ht);
  }
}

// Toàn vùng, tỉ lệ 1:1 với ảnh nền; bản thứ hai cùng nền nhưng hình ½ cỡ.
function veToan(id, s) {
  const c = document.getElementById(id);
  c.width = nen.width; c.height = nen.height;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  g.drawImage(nen, 0, 0);
  veDiem(g, 0, 0, 1, s);
  return c;
}
const toan = veToan("toan_vung", 1);
const toanNua = veToan("toan_vung_nua", 0.5);

// Phóng ×2 một khung 480×360 quanh thành chủ; vùng không có thành chủ (Cấm Khu) thì quanh hang Thú Hoàng đầu tiên.
const tc = duLieu.points.find((p) => p.type === "thanh_chu") ?? duLieu.points.find((p) => p.type === "hang_thu_hoang") ?? duLieu.points[0];
document.getElementById("quanh_thanh_chu").previousElementSibling.textContent = `Quanh ${tc.name ?? tc.type} (×2)`;
const [tx, ty] = viTri(tc);
const W = 480, H = 360, K = 2;
const cx = Math.max(0, Math.min(nen.width - W, Math.round(tx - W / 2)));
const cy = Math.max(0, Math.min(nen.height - H, Math.round(ty - H / 2)));
const quanh = document.getElementById("quanh_thanh_chu");
quanh.width = W * K; quanh.height = H * K;
const gq = quanh.getContext("2d"); gq.imageSmoothingEnabled = false;
gq.drawImage(nen, cx, cy, W, H, 0, 0, W * K, H * K);
veDiem(gq, cx, cy, K);

// Bảng hình trên màu giấy, mỗi ô một hình kèm tên và khoá.
function veBang(id, khoas, phong, cot, nhan) {
  const c = document.getElementById(id);
  const O = 64 * phong, CHU = 36;
  c.width = cot * O; c.height = Math.max(1, Math.ceil(khoas.length / cot)) * (O + CHU);
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  g.fillStyle = "#d8c49a"; g.fillRect(0, 0, c.width, c.height);
  khoas.forEach((k, i) => {
    const x = (i % cot) * O, y = Math.floor(i / cot) * (O + CHU);
    g.strokeStyle = "rgba(90,60,30,0.35)"; g.strokeRect(x + 0.5, y + 0.5, O - 1, O + CHU - 1);
    g.drawImage(hinh[k], x, y, O, O);
    g.fillStyle = "#3a2a18"; g.textAlign = "center";
    g.font = "bold 13px system-ui"; g.fillText(nhan(k), x + O / 2, y + O + 15, O - 4);
    g.font = "10px monospace"; g.fillText(k.split("/")[1], x + O / 2, y + O + 29, O - 4);
  });
  return c;
}
const dem = {};
for (const p of duLieu.points) { const k = khoaCho(p); if (k) dem[k] = (dem[k] ?? 0) + 1; }
const bang = veBang("bang_hinh", khoaDiem, 3, 8, (k) => `${tenCua[k]} (${dem[k] ?? 0})`);
const bangTongMon = veBang("bang_tong_mon", khoaTongMon, 2, 10, (k) => tenCua[k]);

const thieu = muc.filter((m, i) => !anh[i]).map((m) => m.khoa);
trangThai.textContent = `${duLieu.points.length} điểm, ảnh nền ${nen.width}×${nen.height}, tỉ lệ ×${tiLe}. ${khoaDiem.length} hình điểm, ${khoaTongMon.length} đảo tông môn.` + (thieu.length ? ` Thiếu file: ${thieu.join(", ")}.` : "");

if (params.get("luu")) {
  for (const c of [bang, bangTongMon, quanh, toan, toanNua]) {
    const blob = await new Promise((done) => c.toBlob(done, "image/png"));
    await fetch(`/luu?ten=${c.id}.png`, { method: "POST", body: blob });
  }
  trangThai.textContent += " Đã lưu PNG.";
}
document.body.dataset.xong = "1";
</script>
</body>
</html>
