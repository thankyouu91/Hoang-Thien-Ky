<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Thiên Hoang Ký">
  <!-- Dấu triện đỏ son 天荒記 (Thiên Hoang Ký), như dấu ở màn đăng nhập game -->
  <rect x="3" y="3" width="58" height="58" rx="5" fill="#b3261e" transform="rotate(-4 32 32)"/>
  <rect x="7.5" y="7.5" width="49" height="49" rx="3" fill="none" stroke="#fff3e6" stroke-opacity=".55" stroke-width="1.6" transform="rotate(-4 32 32)"/>
  <g fill="#fff8ef" font-family="'Noto Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif" font-weight="700" text-anchor="middle" transform="rotate(-4 32 32)">
    <text x="21" y="30" font-size="17">天</text>
    <text x="21" y="50" font-size="17">荒</text>
    <text x="43" y="47" font-size="27" transform="translate(43 40) scale(1 1.25) translate(-43 -40)">記</text>
  </g>
</svg>
